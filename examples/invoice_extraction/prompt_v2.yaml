# ReleasePlane: AP invoice extraction prompt, v2.
#
# v2 differs from v1 (examples/invoice_extraction/prompt_v1.yaml) by one added
# paragraph in the system prompt: principled discount handling. The v1 live
# baseline (Sonnet 4.6) failed case_14 because the model emitted the volume
# discount as a negative line item (unit_price -100.0), which broke both schema
# validity (unit_price is ge=0) and arithmetic consistency. v2 instructs the
# model to net discounts into the positive line items so they sum to the
# subtotal, which cleared case_14 and brought every tier to 100% on the live
# re-run. The fix is general (any discount/adjustment), not case_14-specific.
#
# Everything else (schemas, developer prompt, linked config) is unchanged from v1.
#
# ADRs:
#   - docs/ADR/0002-pydantic-v2-as-schema-source.md
#   - docs/ADR/0003-three-axis-eval.md
#   - docs/ADR/0004-arithmetic-gate-as-policy-v1.md

name: invoice-extraction
version: v2
team: ap-platform
use_case: ap_invoice_extraction
status: draft
created_by: case14-discount-fix

# Schemas. Both reference Pydantic v2 classes; JSON Schema is generated at load time.
variables_schema:
  source: examples.invoice_extraction.models:InvoiceVariables

output_schema:
  source: examples.invoice_extraction.models:InvoiceExtraction

# Linked configuration.
model_config_ref: v1_default        # see infra/model_configs/v1_default.yaml
policy_bundle_ref: invoice_v1       # see policies registered at control-plane bootstrap

# The system prompt establishes the role and the contract. The discount paragraph
# is the only change from v1.
system_prompt: |
  You extract structured data from Accounts Payable invoices. You return a single
  JSON object conforming to the InvoiceExtraction schema provided in the tool
  contract. You do not return prose, commentary, or markdown. You do not fabricate
  fields. If a field is genuinely absent from the invoice, set it to a defensible
  default (empty string for payment_terms, an empty array is not permitted for
  line_items - all valid invoices have at least one line item).

  Discounts and other downward adjustments are not separate line items. Net every
  discount, rebate, or allowance into the line items it applies to, so that each
  line item keeps a positive quantity and a positive unit_price and the line items
  sum to the subtotal. Never emit a line item with a negative or zero unit_price or
  quantity to represent an adjustment; reduce the affected line's unit_price, or
  spread the adjustment across the affected lines, instead. The subtotal is the sum
  of the net, post-adjustment line items.

  Arithmetic must be consistent:
    - sum(line_items[i].qty * line_items[i].unit_price) equals subtotal
    - subtotal + tax equals total
  within +/- 0.01 currency units. If your computed values disagree, the response
  will be rejected by the policy gate.

# The developer prompt carries the per-request payload.
developer_prompt: |
  Extract the invoice fields from the following PDF text and return a single
  InvoiceExtraction JSON object.

  Invoice text:
  ----
  {{ invoice_pdf_text }}
  ----

# Notes for prompt regression testing.
regression_notes: |
  Known sensitive cases in evals/datasets/invoice_v1/:
    - case_03 (Tier 1): single line item, baseline pass.
    - case_14 (Tier 2): multi-line with a discount row. The v1 prompt let the
      model emit the discount as a negative line item, failing schema and
      arithmetic; v2's discount paragraph nets it into the line items and the
      live re-run passes (line_items_sum 1150.01 vs subtotal 1150.00, inside the
      0.01 tolerance).
    - case_21 (Tier 2): vendor with leading zeros in invoice_number; OCR confuses
      0 / O. Checksum-exact-match catches.
    - case_27 (Tier 3): handwritten annotations on subtotal row. Monitored only.
