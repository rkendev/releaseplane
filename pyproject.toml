# Workspace umbrella. The installable SDK package owns the `releaseplane`
# distribution name (see sdk/pyproject.toml); this root is named distinctly so
# uv does not see two workspace members with the same name.
[project]
name = "releaseplane-workspace"
version = "0.0.0"
description = "Workspace root for the ReleasePlane control plane."
requires-python = ">=3.12"
readme = "README.md"
# Depend on every workspace member so a plain `uv sync` installs all packages
# (and their runtime deps) into the dev environment. The root itself is virtual.
dependencies = [
    "releaseplane-control",
    "releaseplane-gateway",
    "releaseplane-evals",
    "releaseplane",
    "releaseplane-shared",
]

[tool.uv]
package = false

[tool.uv.sources]
releaseplane-control = { workspace = true }
releaseplane-gateway = { workspace = true }
releaseplane-evals = { workspace = true }
releaseplane = { workspace = true }
releaseplane-shared = { workspace = true }

[tool.uv.workspace]
members = ["control-plane", "gateway", "evals", "sdk", "shared"]

# Dev toolchain, pinned in uv.lock so `make check` and pre-commit resolve the
# same versions everywhere. Versions track .pre-commit-config.yaml.
[dependency-groups]
dev = [
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["evals/datasets/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["S101"]  # asserts in tests

[tool.ruff.lint.per-file-ignores]
# The dataset generator uses the stdlib PRNG with a fixed seed for reproducible
# synthetic data; it is not security-sensitive.
"evals/src/releaseplane_evals/generator/invoices.py" = ["S311"]
# The public-readiness test shells out to git and to the brand-guard script by
# name, with fixed arguments and no user input, to assert repo-level properties.
"tests/test_public_readiness.py" = ["S603", "S607"]
# The brand guard's history mode invokes git (rev-list, grep) by name with fixed
# arguments and no user input.
"tools/brand_guard.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
# shared/src is on the mypy path so the gateway and evals resolve the neutral
# releaseplane_shared package the same way under `make check` and the pre-commit
# hook (the latter runs mypy in an isolated env that does not install the
# workspace).
mypy_path = ["shared/src"]
# Generated data and the dataset generator are excluded: the generator imports
# the reference `examples` package, which is not an installed module on mypy's
# path. It is exercised by the determinism tests instead.
exclude = ["evals/datasets/", "evals/src/releaseplane_evals/generator/"]

[tool.pytest.ini_options]
testpaths = ["control-plane/tests", "gateway/tests", "evals/tests", "sdk/tests"]
# importlib mode lets each package keep a plain (non-package) tests/ dir, so the
# four tests/ directories do not collide as a single top-level "tests" module.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
# Repo root on the path so tests can import the canonical `examples` schema
# package, which is a reference (not an installed workspace member).
pythonpath = ["."]
