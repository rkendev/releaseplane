[project]
name = "releaseplane"
version = "0.0.0"
description = "ReleasePlane SDK: client library with release_id stamping and trace propagation."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "opentelemetry-api>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
releaseplane = "releaseplane.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
