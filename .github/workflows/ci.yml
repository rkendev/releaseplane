# CI: run the same gates as the local pre-commit and `make check` on every push
# to main and every pull request targeting main. Lint, type-check, and tests.
# A Postgres service backs the control-plane integration tests; the unit tests
# stay database-free. REQUIRE_DB=1 turns a missing DATABASE_URL into a hard error
# so the integration tests can never skip unnoticed. No live API calls, no
# secrets: the cost-delta probe lives outside pytest's testpaths and skips when
# ANTHROPIC_API_KEY is unset, which it always is here.
#
# A second job, secret-scan, runs gitleaks over the full git history on every
# run: it is the standing gate behind the public flip, so a committed secret
# fails CI rather than being caught once by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Inline credentials match the service below; no secret file in CI, so the
      # engine reads the password from the URL.
      DATABASE_URL: postgresql+asyncpg://releaseplane:releaseplane@localhost:5432/releaseplane
      REQUIRE_DB: "1"

    services:
      postgres:
        # Pinned to the same digest as the dev-stack compose for parity.
        image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
        env:
          POSTGRES_DB: releaseplane
          POSTGRES_USER: releaseplane
          POSTGRES_PASSWORD: releaseplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releaseplane -d releaseplane"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Pinned to the exact latest release: setup-uv has no moving v8 major tag
      # yet (bare tags stop at v7). Switch to @v8 once that tag ships.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Apply the migrations to the clean service Postgres, then assert the
      # models and the migration history agree. `alembic check` exits non-zero
      # if autogenerate would emit any operation, so a model added without a
      # matching migration fails CI. Runs before `make check`: the test suite's
      # create_all is additive (checkfirst), so it is a no-op against the
      # migrated schema and the integration tests then run on the real DDL.
      - name: Migrations apply and match models (no drift)
        working-directory: control-plane
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # Full-tree hooks (yaml, eof, trailing-whitespace, ruff, mypy,
      # banned-words, brand-guard). The mypy hook builds its own env from the
      # config's additional_dependencies, so nothing extra is installed here.
      - name: Pre-commit
        run: uv run pre-commit run --all-files

      # Mirror the brand guard as a standalone step over every tracked file, so
      # the cross-project brand and the external KB path cannot return even if the
      # pre-commit step is ever changed. Same script the hook runs.
      - name: Brand guard (all tracked files)
        run: git ls-files -z | xargs -0 uv run python tools/brand_guard.py

      # Repo-level presence and public-readiness checks (lattice wiring, .gitignore
      # coverage of secrets, the demo overlay's exposure boundary, the brand
      # guard's own behavior). These live in the root tests/ tree, outside the
      # package testpaths make check runs.
      #
      # Under the same zero-call grep as make check below. This step executes
      # infra/scripts/populate_demo.sh on purpose, to prove its spend gate refuses,
      # and that script is the one thing in the repo whose whole job is to reach a
      # provider. The gate holds by inspection, so this is the belt to that brace.
      - name: Repo-level guards (zero API calls)
        run: |
          set -o pipefail
          make lattice 2>&1 | tee make-lattice.log
          if grep -Eqi "api\.(anthropic|openai)\.com" make-lattice.log; then
            echo "a repo-level guard reached a provider API; the build must make zero live calls"
            exit 1
          fi

      # ruff + mypy on the source, then pytest. The integration tests build the
      # schema against the Postgres service and exercise the registry, promote,
      # and gateway /invoke routes (DummyProvider); unit tests run without a
      # database. The grep guard fails the run if any test reaches a provider
      # API (Anthropic or OpenAI): the build must make zero live calls.
      - name: make check (zero API calls)
        run: |
          set -o pipefail
          make check 2>&1 | tee make-check.log
          if grep -Eqi "api\.(anthropic|openai)\.com" make-check.log; then
            echo "a test reached a provider API (anthropic/openai); the build must make zero live calls"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls the full history so gitleaks scans every commit, not
      # just the tip. This is the public-flip pre-condition, enforced continuously.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks pinned by manifest digest (v8.21.2), matching the local scanner.
      # `detect` scans the committed history; --redact keeps any match out of the
      # logs. The container exits non-zero on any finding, which fails the job.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --redact --no-banner
