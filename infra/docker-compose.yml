# ReleasePlane local dev stack. Phase 1 wires the services for real; Phase 0
# commits this skeleton so the runbook can reference exact service names.
#
# Image digests stay pinned (not just tags) per ADR lesson from prior infra work.
# Healthchecks live with each service.

services:
  postgres:
    image: postgres:17-alpine@sha256:PLACEHOLDER_DIGEST  # Phase 1: pin a real digest
    container_name: releaseplane-postgres
    environment:
      POSTGRES_DB: releaseplane
      POSTGRES_USER: releaseplane
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseplane -d releaseplane"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2026-PLACEHOLDER@sha256:PLACEHOLDER_DIGEST
    container_name: releaseplane-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: releaseplane
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0@sha256:PLACEHOLDER_DIGEST
    container_name: releaseplane-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.62@sha256:PLACEHOLDER_DIGEST
    container_name: releaseplane-jaeger
    ports:
      - "16686:16686"
      - "4317"  # internal only

  prometheus:
    image: prom/prometheus:v3.0.1@sha256:PLACEHOLDER_DIGEST
    container_name: releaseplane-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0@sha256:PLACEHOLDER_DIGEST
    container_name: releaseplane-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  control-plane:
    build:
      context: ../control-plane
    container_name: releaseplane-control-plane
    environment:
      DATABASE_URL: postgresql+asyncpg://releaseplane@postgres:5432/releaseplane
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ../gateway
    container_name: releaseplane-gateway
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      CLAUDE_API_KEY_FILE: /run/secrets/claude_api_key
    secrets:
      - claude_api_key
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  grafana_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_password:
    file: ./secrets/minio_root_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  claude_api_key:
    file: ./secrets/claude_api_key
