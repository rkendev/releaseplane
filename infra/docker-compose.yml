# ReleasePlane local dev stack. Phase 1 wires the services for real; Phase 0
# commits this skeleton so the runbook can reference exact service names.
#
# Image digests stay pinned (not just tags) per ADR lesson from prior infra work.
# Healthchecks live with each service.
#
# This file is a local dev stack and publishes on 0.0.0.0, which is what Docker
# does by default. On a machine with a public address that means Postgres, MinIO,
# the control plane, and the gateway answer from the internet, and the control
# plane has no authentication in front of it. A host firewall does not fix that on
# its own: Docker's DNAT rules run ahead of the filter rules ufw manages, so a
# published port stays reachable unless the host wires a DOCKER-USER rule. Run
# this on a laptop or a private network. On anything internet-facing, add
# `-f infra/docker-compose.demo.yml`, which rebinds every service to 127.0.0.1
# (see the "Read-only demo" section of docs/RUNBOOK.md).

services:
  postgres:
    image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
    container_name: releaseplane-postgres
    environment:
      POSTGRES_DB: releaseplane
      POSTGRES_USER: releaseplane
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseplane -d releaseplane"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: releaseplane-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: releaseplane
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0@sha256:ffc818ee108d0b934fd14207fd87ff247c9b64f344ed349d0b66c166c18a2312
    container_name: releaseplane-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: releaseplane-jaeger
    ports:
      - "16686:16686"
      - "4317"  # internal only

  prometheus:
    image: prom/prometheus:v3.0.1@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd
    container_name: releaseplane-prometheus
    # The image defaults to the first two flags only; naming any command replaces
    # the whole list, so both are restated. Retention is long because the eval
    # metrics are emitted once per run: the samples in the TSDB are what keeps a
    # dashboard readable long after the run that produced them.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2y
      # Time alone would let disk be the only real bound, so cap size too;
      # whichever limit hits first wins.
      - --storage.tsdb.retention.size=2GB
      # A read-only visitor can issue PromQL through Grafana's datasource proxy
      # once the demo overlay is on, so bound what one query may cost. Neither
      # --web.enable-admin-api nor --web.enable-lifecycle is set, so the proxy
      # cannot reach a mutating endpoint.
      - --query.timeout=30s
      - --query.max-samples=5000000
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    # Kept current rather than merely pinned. The demo overlay serves this
    # instance anonymously on the public internet, and CVE-2025-3260 was an
    # authorization bypass in the dashboard API that named anonymous-auth
    # instances specifically, so an old pin is not a safe pin here.
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: releaseplane-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  control-plane:
    build:
      context: ../control-plane
    container_name: releaseplane-control-plane
    environment:
      DATABASE_URL: postgresql+asyncpg://releaseplane@postgres:5432/releaseplane
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # The eval gate is on by default from Phase 4; stated here for visibility.
      # A promotion needs a recent passing eval run (see docs/EVALUATION.md).
      EVAL_GATE_ENFORCED: "true"
    secrets:
      - postgres_password
    # The build context is ../control-plane, so the seed YAML (under infra/) is
    # not in the image. Mount the canonical file read-only at the default
    # MODEL_CONFIG_SEED_PATH (relative to WORKDIR /app) so POST /model-configs/seed
    # resolves in-container without baking a copy in and risking drift.
    volumes:
      - ../infra/model_configs:/app/infra/model_configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      # Repo root context so the image can install the neutral shared package
      # next to the gateway (the runtime arithmetic policy imports it).
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: releaseplane-gateway
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      CLAUDE_API_KEY_FILE: /run/secrets/claude_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      # dummy by default so the stack runs with zero API spend; set to claude to
      # route /invoke at the real model (needs a valid key in the secret file).
      GATEWAY_PROVIDER: dummy
    secrets:
      - claude_api_key
      - openai_api_key
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  prometheus_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_password:
    file: ./secrets/minio_root_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  claude_api_key:
    file: ./secrets/claude_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
