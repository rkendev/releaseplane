# Prometheus scrape config for the ReleasePlane dev stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics that the OpenTelemetry Collector re-exports from the app OTLP feeds.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Direct app scrape targets; live once the services expose /metrics (Task 5).
  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane:8000"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
