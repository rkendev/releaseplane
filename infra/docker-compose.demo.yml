# Opt-in overlay for the public read-only demo.
#
# Inert unless explicitly composed in, so a plain bring-up is unchanged by this
# file and the committed base never enables anonymous Grafana.
#
#   docker compose -p releaseplane \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.demo.yml up -d
#
# Two things happen here.
#
# 1. Every published port moves to 127.0.0.1. On a host where Docker publishes on
#    0.0.0.0, the raw ports are reachable on the public IP directly, bypassing the
#    reverse proxy. A host firewall is not a second layer for this: Docker's DNAT
#    rules sit in the nat table ahead of the filter rules ufw manages, so unless
#    the host wires a DOCKER-USER rule, ufw does not gate a published container
#    port at all. The loopback bind is the control that actually holds.
#
# 2. Grafana serves anonymous Viewer and nothing else. A visitor reads the
#    dashboards without a login and cannot edit, create, or delete anything, and
#    there is no login to attempt either: the proxy forwards the whole service, so
#    an enabled login form would be a public credential oracle. Both auth paths
#    are off. `make demo-admin` layers the login back on without dropping these
#    loopback binds, for the owner over an SSH tunnel.
#
# Grafana and Jaeger are on loopback too. They are public only through the reverse
# proxy vhosts (see the "Read-only demo" section of docs/RUNBOOK.md).
#
# Bring this up with `make demo-up`, not a hand-written compose line. A bring-up
# that forgets this file republishes everything on 0.0.0.0.
#
# `!override` replaces the port list rather than appending to it. Without it,
# compose merges the lists and the original 0.0.0.0 binding survives. A client too
# old to understand the tag fails to parse the merged config, which is the right
# way to fail.
#
# Host ports are variables so this tracked file carries no one host's layout. The
# defaults match the base compose; a host that remaps ports sets them in
# `infra/.env` (gitignored), which compose reads from the project directory. Same
# for the public origin: DEMO_ROOT_URL is whatever hostname the proxy serves.

services:
  postgres:
    ports: !override
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"

  minio:
    ports: !override
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  otel-collector:
    ports: !override
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  jaeger:
    # The base also publishes a bare "4317", which Docker maps to a random host
    # port on 0.0.0.0. Nothing outside the compose network uses it (the collector
    # reaches jaeger:4317 over the network), so the replacement list drops it.
    ports: !override
      - "127.0.0.1:16686:16686"

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous read-only access. Viewer cannot edit, and sign-up is off.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      # The proxy forwards the whole Grafana surface, so leaving authentication on
      # would put a working credential oracle on the internet: POST /login answers
      # 200 on the right password and 401 on the wrong one. Grafana's brute-force
      # protection locks a user after five failures, which bounds guessing one
      # known account but not enumeration, and nothing rate-limits by source.
      # Turning both paths off makes "the public surface is read-only" true by
      # construction rather than a claim about what a visitor bothers to try.
      # There is nothing to administer at runtime anyway: the dashboards and the
      # datasource are provisioned from files.
      #
      # `make demo-admin` puts the login back for the owner while keeping these
      # loopback binds. The base keeps the admin password mounted from its secret
      # file, so nothing is lost, only unreachable while this overlay is what
      # faces the internet.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Snapshot sharing defaults to on and posts dashboard data to a third-party
      # host. Nothing here needs outbound sharing, and this stays set under the
      # admin overlay too, so no session can open that egress path. Grafana's own
      # phone-home calls go with it: a public instance should originate no traffic
      # a visitor did not ask for.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Two more visitor-driven egress paths, both on by default. GET
      # /avatar/<32-hex> returned 200 in 0.57s against gravatar.com, over an
      # unbounded hash space, so any visitor could drive outbound requests from
      # this box at will. The news feed fetches grafana.com on page load. Neither
      # is a vhost rule, because the right place to stop an outbound request is
      # the process that would make it.
      GF_USERS_DISABLE_GRAVATAR: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # The proxy terminates TLS and forwards to loopback, so Grafana needs the
      # public origin to build correct redirects and share links.
      GF_SERVER_ROOT_URL: ${DEMO_ROOT_URL:-http://localhost:3000/}
      # Land a visitor on the eval story rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/eval.json

  control-plane:
    ports: !override
      - "127.0.0.1:${CONTROL_PLANE_HOST_PORT:-8001}:8000"

  gateway:
    ports: !override
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8002}:8000"
    environment:
      # Zero spend unless deliberately unpinned. `make demo-up` names its compose
      # files explicitly, so a local docker-compose.override.yml is not read and
      # cannot be the place this is set; without this line the demo host has no way
      # to unpin at all, which is what the population run needs.
      #
      # Note the single dash. `${VAR-default}` keeps an empty value, so setting
      # GATEWAY_PROVIDER= in infra/.env means "follow the model config", which is
      # exactly what selecting a provider per request requires. `:-` would fall
      # back to dummy and quietly make the population run spend nothing.
      GATEWAY_PROVIDER: ${GATEWAY_PROVIDER-dummy}
