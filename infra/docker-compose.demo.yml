# Opt-in overlay for the public read-only demo.
#
# Inert unless explicitly composed in, so a plain bring-up is unchanged by this
# file and the committed base never enables anonymous Grafana.
#
#   docker compose -p releaseplane \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.demo.yml up -d
#
# Two things happen here.
#
# 1. Every published port moves to 127.0.0.1. On a host where Docker publishes on
#    0.0.0.0, the raw ports are reachable on the public IP directly, bypassing the
#    reverse proxy. A host firewall is not a second layer for this: Docker's DNAT
#    rules sit in the nat table ahead of the filter rules ufw manages, so unless
#    the host wires a DOCKER-USER rule, ufw does not gate a published container
#    port at all. The loopback bind is the control that actually holds.
#
# 2. Grafana serves anonymous Viewer, so a visitor reads the dashboards without a
#    login and cannot edit, create, or delete anything. The admin login still
#    works for the owner: the base's secret-file password mount is untouched.
#
# Grafana and Jaeger are on loopback too. They are public only through the reverse
# proxy vhosts (see the "Read-only demo" section of docs/RUNBOOK.md).
#
# `!override` replaces the port list rather than appending to it. Without it,
# compose merges the lists and the original 0.0.0.0 binding survives. It needs
# Compose v2.24 or newer; an older client fails to parse the merged config, which
# is the right way to fail.
#
# Host ports are variables so this tracked file carries no one host's layout. The
# defaults match the base compose; a host that remaps ports sets them in
# `infra/.env` (gitignored), which compose reads from the project directory. Same
# for the public origin: DEMO_ROOT_URL is whatever hostname the proxy serves.

services:
  postgres:
    ports: !override
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"

  minio:
    ports: !override
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  otel-collector:
    ports: !override
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  jaeger:
    # The base also publishes a bare "4317", which Docker maps to a random host
    # port on 0.0.0.0. Nothing outside the compose network uses it (the collector
    # reaches jaeger:4317 over the network), so the replacement list drops it.
    ports: !override
      - "127.0.0.1:16686:16686"

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous read-only access. Viewer cannot edit, and sign-up is off, so
      # there is no path from the public URL to a write.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      # Snapshot sharing defaults to on and posts dashboard data to a third-party
      # host. An anonymous Viewer cannot reach it, but an owner session can, and
      # nothing here needs outbound sharing, so close the egress path outright.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # The proxy terminates TLS and forwards to loopback, so Grafana needs the
      # public origin to build correct redirects and share links.
      GF_SERVER_ROOT_URL: ${DEMO_ROOT_URL:-http://localhost:3000/}
      # Land a visitor on the eval story rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/eval.json

  control-plane:
    ports: !override
      - "127.0.0.1:${CONTROL_PLANE_HOST_PORT:-8001}:8000"

  gateway:
    ports: !override
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8002}:8000"
