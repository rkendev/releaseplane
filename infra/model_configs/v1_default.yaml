# ReleasePlane v1 model config.
#
# Pinned to an exact model version string per ADR 0001 lineage (silent model
# retirement is one of the named failure modes in Use_Case.txt). The version
# string here drives the value of model_configs.model_version_pin in Postgres.
#
# Updating this file does not in itself promote a new release. The control-plane
# treats this YAML as the seed for a new model_configs row; promoting a release
# that references the new row goes through the same gate as a prompt change.

name: v1_default
provider: claude
model_name: claude-sonnet-4-6
model_version_pin: "claude-sonnet-4-6"      # exact string, recorded for audit; not enforced at call time
temperature: 0.0                            # deterministic extraction
max_tokens: 4096
timeout_ms: 30000
tool_mode: structured_output                # routes to the adapter's generate_structured() path
cost_per_mtok_input_usd: 3.00               # [volatile: 2026-06-23] verified Sonnet 4.6 input rate, per million tokens.
cost_per_mtok_output_usd: 15.00             # [volatile: 2026-06-23] verified Sonnet 4.6 output rate, per million tokens.
active: true
