# Alembic config for the control plane.
#
# The database URL is not stored here; env.py reads DATABASE_URL and the
# password from the mounted secret file (DATABASE_PASSWORD_FILE), the same way
# the app does. Run migrations from the control-plane directory, e.g.
#   uv run alembic upgrade head
#   uv run alembic downgrade base

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
